[build-system]
requires = ["setuptools>=75,<76", "wheel>=0.45,<0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "pt-email-benchmark-lean"
version = "1.0.0"
description = "Deterministic benchmark for PT-PT business-email understanding and generation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Apache-2.0"}
authors = [{name = "ClosetRedPanda"}]
keywords = ["benchmark", "european-portuguese", "llm", "email", "nlp"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

# Dependency pinning lives in requirements.in/requirements.lock (the
# hash-locked environment CI installs). A duplicate range block here would
# drift from the lock, so it is deliberately omitted.

[project.urls]
Repository = "https://github.com/ClosetRedPanda/pt-pt-email-benchmark"
Documentation = "https://github.com/ClosetRedPanda/pt-pt-email-benchmark/tree/main/docs"
Issues = "https://github.com/ClosetRedPanda/pt-pt-email-benchmark/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
