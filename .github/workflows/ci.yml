name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies (JRE for LanguageTool)
        run: |
          # The runner image ships third-party apt sources (Chrome, Microsoft)
          # that this benchmark never needs. A flaky third-party index (e.g.
          # dl.google.com serving a stale Packages file) must not be able to
          # fail `apt-get update`, so drop those lists and refresh the cache
          # before installing from the Ubuntu archive.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
                     /etc/apt/sources.list.d/microsoft-*.list
          sudo rm -rf /var/lib/apt/lists/*
          for attempt in 1 2 3 4 5; do
            echo "apt-get update attempt ${attempt}/5"
            sudo apt-get update && break || sleep 10
          done
          sudo apt-get install -y --no-install-recommends build-essential default-jre

      - name: Install hash-locked Python environment
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Confirm source inventory and managed-resource policy
        run: |
          test -z "$(git ls-files 'docs/*.aff' 'docs/*.dic')"
          git ls-files | LC_ALL=C sort | diff -u MANIFEST.txt -

      - name: Fetch and verify managed evaluator resources
        run: python runner.py setup

      - name: Run benchmark integrity validation
        run: python runner.py validate

      - name: Verify deterministic smoke baseline
        run: |
          python tools/run_smoke_baseline.py --output baselines/smoke-baseline.json
          git diff --exit-code -- baselines/smoke-baseline.json

      - name: Assert scoring floor is zero (no free credit for boilerplate)
        run: python tools/check_scoring_floor.py
      - name: Report detector agreement with the gold labels
        run: python tools/gold_agreement.py --check-baseline baselines/gold-agreement.json

      - name: Run unit tests
        run: python -m pytest -q
