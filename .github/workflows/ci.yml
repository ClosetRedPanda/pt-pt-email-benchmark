name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies (JRE for LanguageTool)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-jre

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install spylls

      - name: Download spaCy European-Portuguese model
        run: python -m spacy download pt_core_news_sm

      - name: Fetch and verify managed model resources (EUPTVID)
        run: python runner.py setup

      - name: Run benchmark integrity validation
        run: python runner.py validate

      - name: Run unit tests
        run: python -m pytest -q
