name: Publish smoke baseline artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/**"
      - "core/schemas.py"
      - "core/generation_evaluator.py"
      - "tools/run_smoke_baseline.py"
      - "baselines/**"

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
                     /etc/apt/sources.list.d/microsoft-*.list
          sudo rm -rf /var/lib/apt/lists/*
          for attempt in 1 2 3 4 5; do
            echo "apt-get update attempt ${attempt}/5"
            sudo apt-get update && break || sleep 10
          done
          sudo apt-get install -y --no-install-recommends build-essential
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python tools/run_smoke_baseline.py --output baselines/smoke-baseline.json
      - run: git diff --exit-code -- baselines/smoke-baseline.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deterministic-smoke-baseline
          path: baselines/smoke-baseline.json
          if-no-files-found: error
