name: Stage release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential default-jre
      - name: Install locked environment
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify source, resources, and tests
        run: |
          test -z "$(git ls-files 'docs/*.aff' 'docs/*.dic')"
          git ls-files | LC_ALL=C sort | diff -u MANIFEST.txt -
          python runner.py setup
          python runner.py validate
          python tools/gold_agreement.py --check-baseline baselines/gold-agreement.json
          python -m pytest -q
          python tools/run_smoke_baseline.py --output baselines/smoke-baseline.json
          git diff --exit-code -- baselines/smoke-baseline.json
      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          assets=(baselines/smoke-baseline.json CITATION.cff data/PROVENANCE.json)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --verify-tag --draft \
              --generate-notes --title "$tag"
          fi
          echo "A draft release was staged. Review provenance/non-claims before publishing."
